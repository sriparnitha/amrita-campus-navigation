<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amrita Smart Campus Navigator - Ettimadai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #003366;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .navigator-card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      color: #003366;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      flex: 1;
      min-width: 220px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select,
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #003366;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #00509e;
    }

    #map {
      width: 100%;
      height: 480px;
      border-radius: 12px;
      margin-top: 10px;
    }

    #directionsPanel {
      margin-top: 20px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      #map {
        height: 350px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Amrita Smart Campus Navigator</h1>
    <p>Find directions across Amrita Vishwa Vidyapeetham, Ettimadai, Coimbatore</p>
  </header>

  <div class="container">
    <div class="navigator-card">
      <h2>Get Directions</h2>

      <div class="form-row">
        <div class="form-group">
          <label for="from">From</label>
          <select id="from">
            <option value="Amrita Vishwa Vidyapeetham, Amritanagar, Ettimadai, Coimbatore, Tamil Nadu 641112">
              Main Gate
            </option>

            <option value="Amrita Vishwa Vidyapeetham Central Library, Amritanagar, Ettimadai, Coimbatore">
              Central Library
            </option>

            <option value="Amrita Vishwa Vidyapeetham Boys Hostel, Amritanagar, Ettimadai, Coimbatore">
              Boys Hostel
            </option>

            <option value="Amrita Vishwa Vidyapeetham Girls Hostel, Amritanagar, Ettimadai, Coimbatore">
              Girls Hostel
            </option>

            <option value="Amrita School of Engineering, Amritanagar, Ettimadai, Coimbatore">
              School of Engineering
            </option>

            <option value="Amrita School of Business, Amritanagar, Ettimadai, Coimbatore">
              School of Business
            </option>

            <option value="Amrita School of Computing and Artificial Intelligence, Amritanagar, Ettimadai, Coimbatore">
              School of Computing and AI
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="to">To</label>
          <select id="to">
            <option value="Amrita Vishwa Vidyapeetham Central Library, Amritanagar, Ettimadai, Coimbatore">
              Central Library
            </option>

            <option value="Amrita Vishwa Vidyapeetham Boys Hostel, Amritanagar, Ettimadai, Coimbatore">
              Boys Hostel
            </option>

            <option value="Amrita Vishwa Vidyapeetham Girls Hostel, Amritanagar, Ettimadai, Coimbatore">
              Girls Hostel
            </option>

            <option value="Amrita School of Engineering, Amritanagar, Ettimadai, Coimbatore">
              School of Engineering
            </option>

            <option value="Amrita School of Business, Amritanagar, Ettimadai, Coimbatore">
              School of Business
            </option>

            <option value="Amrita School of Computing and Artificial Intelligence, Amritanagar, Ettimadai, Coimbatore">
              School of Computing and AI
            </option>

            <option value="Amrita Vishwa Vidyapeetham, Amritanagar, Ettimadai, Coimbatore, Tamil Nadu 641112">
              Main Gate
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="mode">Travel Mode</label>
          <select id="mode">
            <option value="WALKING">Walking</option>
            <option value="DRIVING">Driving</option>
            <option value="BICYCLING">Cycling</option>
          </select>
        </div>
      </div>

      <button id="getDirections">Get Directions</button>

      <div id="map"></div>
      <div id="directionsPanel"></div>
    </div>
  </div>

  <footer>
    Amrita Smart Campus Navigator | Ettimadai Campus, Coimbatore
  </footer>

  <script>
    let map;
    let directionsService;
    let directionsRenderer;

    function initMap() {
      const amritaEttimadaiCampus = {
        lat: 10.9038,
        lng: 76.9003
      };

      map = new google.maps.Map(document.getElementById("map"), {
        center: amritaEttimadaiCampus,
        zoom: 16,
        mapTypeControl: true,
        streetViewControl: true
      });

      directionsService = new google.maps.DirectionsService();

      directionsRenderer = new google.maps.DirectionsRenderer({
        map: map,
        panel: document.getElementById("directionsPanel")
      });

      document
        .getElementById("getDirections")
        .addEventListener("click", calculateRoute);
    }

    function calculateRoute() {
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const mode = document.getElementById("mode").value;

      directionsService
        .route({
          origin: from,
          destination: to,
          travelMode: google.maps.TravelMode[mode]
        })
        .then((response) => {
          directionsRenderer.setDirections(response);
        })
        .catch(() => {
          alert(
            "Could not find directions. Please check the selected locations or try another travel mode."
          );
        });
    }

    window.initMap = initMap;
  </script>

  <script
    async
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap&libraries=routes"
  ></script>

</body>
</html>
